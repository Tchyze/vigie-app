name: Tests et APK debug

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      # Les JSON d'exemple doivent respecter le contrat du collecteur (copie dans schema/).
      - name: Conformité des JSON d'exemple
        run: |
          pipx run check-jsonschema --schemafile schema/index.schema.json app/src/main/assets/demo/index.json
          pipx run check-jsonschema --schemafile schema/product.schema.json app/src/main/assets/demo/products/*.json
          pipx run check-jsonschema --schemafile schema/advisories.schema.json app/src/main/assets/demo/advisories.json

      # Le SDK Android est préinstallé sur le runner ; AGP télécharge la plateforme manquante.
      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build de l'APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Rapport de tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapport-tests
          path: app/build/reports/tests/

      - name: APK debug
        uses: actions/upload-artifact@v7
        with:
          name: vigie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
