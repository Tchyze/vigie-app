name: Publication d'une version

# Publie une version sur GitHub : tests, APK release signé, version (pré-version si le tag a un tiret).
# Deux déclencheurs :
# - pousser un tag (par exemple 0.1.0-beta) ;
# - lancer le workflow à la main (onglet Actions, « Run workflow », aussi depuis l'appli mobile) avec
#   le nom du tag : le tag est alors créé sur le commit de la branche choisie.
on:
  push:
    tags: ["*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la version (doit être égal à versionName, par exemple 0.1.0-beta)"
        required: true
        type: string

env:
  TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Cohérence du tag et de la version
        run: |
          version=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)
          if [ "$version" != "$TAG" ]; then
            echo "::error::Le tag $TAG ne correspond pas à versionName ($version) dans app/build.gradle.kts."
            exit 1
          fi

      # Clé de signature : secret VIGIE_KEYSTORE_BASE64 (keystore encodé en base64) et mots de passe.
      # Sans ce secret, l'APK est signé avec la clé debug du runner (voir README).
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.VIGIE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/vigie.jks"
            echo "VIGIE_KEYSTORE=$RUNNER_TEMP/vigie.jks" >> "$GITHUB_ENV"
            echo "SIGNATURE=Signé avec la clé de publication de Vigie." >> "$GITHUB_ENV"
          else
            echo "::warning::Secret VIGIE_KEYSTORE_BASE64 absent : APK signé avec une clé debug."
            echo "SIGNATURE=Signé avec une clé debug temporaire : désinstallez toute version précédente avant d'installer celle-ci (exportez l'inventaire d'abord)." >> "$GITHUB_ENV"
          fi

      - name: Tests unitaires
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build de l'APK
        env:
          VIGIE_KEYSTORE_PASSWORD: ${{ secrets.VIGIE_KEYSTORE_PASSWORD }}
          VIGIE_KEY_ALIAS: ${{ secrets.VIGIE_KEY_ALIAS }}
          VIGIE_KEY_PASSWORD: ${{ secrets.VIGIE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Publication sur GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="vigie-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          notes="docs/release-notes/$TAG.md"
          [ -f "$notes" ] || { echo "Version $TAG de Vigie." > "$RUNNER_TEMP/notes.md"; notes="$RUNNER_TEMP/notes.md"; }
          printf '\n---\n%s\n\nEmpreinte SHA-256 : `%s`\n' "$SIGNATURE" "$(cut -d' ' -f1 "$apk.sha256")" >> "$notes"
          # Tag poussé : il existe déjà. Lancement manuel : GitHub crée le tag sur le commit construit.
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then target="--verify-tag"; else target="--target $GITHUB_SHA"; fi
          gh release create "$TAG" "$apk" "$apk.sha256" --title "Vigie $TAG" --notes-file "$notes" $prerelease $target
